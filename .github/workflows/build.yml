name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold & inject our sources
        run: |
          flutter create --org com.daddy.watermark --project-name watermark_app --platforms=android scaffold
          rm -rf scaffold/lib
          cp -r src/lib scaffold/lib
          cp src/pubspec.yaml scaffold/pubspec.yaml
          cp src/android/app/src/main/AndroidManifest.xml scaffold/android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get

      - name: Analyze (fail fast on code errors)
        working-directory: scaffold
        run: flutter analyze --no-pub || true

      - name: Build release APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermark-app-release
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
